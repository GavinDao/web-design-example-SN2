<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#130504" />
    <title>Clown Boy — Halloween Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root { --blood: #d43a27; --ember: #ff7b5f; --bone: #f0ddd3; --muted: rgba(240,221,211,.68); --hairline: rgba(240,221,211,.24); }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-width: 320px; min-height: 100%; margin: 0; background: #090202; }
      body { overflow: hidden; color: var(--bone); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      button, a { font: inherit; }
      .hero { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; isolation: isolate; background: #0e0e0e; }
      .scene-fallback, .pixel-blast, .dither-veil, .atmosphere { position: absolute; inset: 0; width: 100%; height: 100%; }
      .scene-fallback, .atmosphere { display: none; }
      .pixel-blast { z-index: 1; display: block; pointer-events: none; }
      .dither-veil { z-index: 3; display: block; pointer-events: none; touch-action: none; animation: subject-in 1.1s cubic-bezier(.2,.8,.2,1) both; }
      .grain { display: none; }
      .topbar, .copy, .meta, .hint { position: absolute; z-index: 8; }
      .topbar { top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 30px 38px; border-bottom: 1px solid rgba(240,221,211,.12); animation: fade-down .8s .18s both; }
      .mark { display: flex; align-items: center; gap: 12px; color: var(--bone); font-size: 11px; font-weight: 600; letter-spacing: .22em; }
      .mark-dot { width: 9px; height: 9px; border: 1px solid var(--ember); border-radius: 50%; box-shadow: 0 0 18px rgba(255,74,45,.85); }
      .edition { color: var(--muted); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; }
      .copy { left: 4.8vw; top: 50%; width: min(410px,34vw); transform: translateY(-47%); text-shadow: 0 2px 24px rgba(0,0,0,.78); }
      .eyebrow { margin: 0 0 18px; color: var(--ember); font-size: 10px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; animation: fade-up .8s .35s both; }
      h1 { margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(4rem,8.4vw,8.2rem); font-weight: 600; line-height: .72; letter-spacing: -.045em; text-transform: uppercase; animation: fade-up 1s .42s both; }
      .spotlight-title { display: inline-block; white-space: nowrap; user-select: none; font-kerning: normal; text-rendering: geometricPrecision; }
      .spotlight-line { display: block; width: max-content; }
      .spotlight-text { --light-x: 50%; --light-y: 50%; background: radial-gradient(circle 145px at var(--light-x) var(--light-y), #fff8f4 0%, #efb5aa 24%, rgba(240,221,211,.68) 48%, rgba(240,221,211,.22) 72%, rgba(240,221,211,.1) 100%); background-clip: text; -webkit-background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
      .spotlight-line.title-outline { -webkit-text-stroke: 1px rgba(240,221,211,.26); }
      .tagline { width: min(310px,100%); margin: 28px 0 0; color: var(--muted); font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(1rem,1.4vw,1.25rem); line-height: 1.45; letter-spacing: .055em; animation: fade-up .9s .58s both; }
      .tagline.spotlight-text { background: radial-gradient(circle 115px at var(--light-x) var(--light-y), #fff8f4 0%, #efb5aa 27%, rgba(240,221,211,.72) 52%, rgba(240,221,211,.25) 76%, rgba(240,221,211,.12) 100%); background-clip: text; -webkit-background-clip: text; }
      .cta-row { display: flex; align-items: center; gap: 18px; margin-top: 30px; animation: fade-up .9s .7s both; }
      .cta { display: inline-flex; align-items: center; gap: 14px; padding: 13px 20px; border: 1px solid rgba(240,221,211,.55); border-radius: 999px; background: rgba(12,3,3,.3); color: var(--bone); text-decoration: none; font-size: 10px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; backdrop-filter: blur(8px); transition: background .25s,border-color .25s,transform .25s; }
      .cta:hover { background: rgba(181,38,24,.34); border-color: var(--ember); transform: translateY(-2px); }
      .cta-arrow { color: var(--ember); font-size: 17px; line-height: 0; }
      .edition-no { color: rgba(240,221,211,.5); font-size: 9px; letter-spacing: .17em; }
      .meta { right: 38px; bottom: 32px; display: grid; grid-template-columns: repeat(3,auto); gap: 28px; padding: 14px 0 0 24px; border-top: 1px solid var(--hairline); animation: fade-up .9s .82s both; }
      .meta-item { min-width: 76px; }
      .meta-label { display: block; color: rgba(240,221,211,.44); font-size: 8px; letter-spacing: .2em; text-transform: uppercase; }
      .meta-value { display: block; margin-top: 6px; color: rgba(240,221,211,.85); font-family: 'Cormorant Garamond', Georgia, serif; font-size: 15px; letter-spacing: .04em; }
      .hint { right: 38px; top: 96px; display: flex; align-items: center; gap: 9px; color: rgba(240,221,211,.55); font-size: 8px; letter-spacing: .18em; text-transform: uppercase; animation: fade-down .8s .95s both; }
      .hint-ring { width: 22px; height: 22px; border: 1px solid rgba(255,123,95,.62); border-radius: 50%; box-shadow: inset 0 0 0 5px rgba(212,58,39,.08); }
      .cursor { position: fixed; z-index: 20; top: 0; left: 0; width: 34px; height: 34px; border: 1px solid rgba(255,123,95,.66); border-radius: 50%; pointer-events: none; opacity: 0; transform: translate3d(-50%,-50%,0); transition: width .18s,height .18s,opacity .18s; mix-blend-mode: screen; }
      .hero.has-pointer .cursor { opacity: 1; }
      .hero.is-pressing .cursor { width: 56px; height: 56px; }
      @keyframes subject-in { from { opacity: 0; transform: scale(1.035); filter: blur(8px) drop-shadow(0 34px 34px rgba(0,0,0,.5)); } to { opacity: 1; transform: scale(1); filter: blur(0) drop-shadow(0 34px 34px rgba(0,0,0,.52)); } }
      @keyframes fade-up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fade-down { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes grain { 0% { transform: translate(0,0); } 25% { transform: translate(2%,-3%); } 50% { transform: translate(-3%,2%); } 75% { transform: translate(3%,4%); } 100% { transform: translate(-2%,-3%); } }
      @media (max-width: 820px) {
        .topbar { padding: 22px 20px; } .edition { display: none; }
        .copy { left: 20px; top: auto; bottom: 80px; width: min(330px,calc(100vw - 40px)); transform: none; }
        h1 { font-size: clamp(3.4rem,18vw,6rem); } .tagline { width: 260px; margin-top: 20px; font-size: 1rem; }
        .cta-row { margin-top: 22px; } .meta { right: 20px; bottom: 18px; gap: 14px; padding-left: 14px; }
        .meta-item { min-width: 48px; } .meta-item:first-child { display: none; } .hint { top: 76px; right: 20px; }
        .scene-fallback { object-position: 54% center; }
      }
      @media (pointer: coarse) { .cursor { display: none; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
    </style>
  </head>
  <body>
    <main class="hero" id="hero">
      <img class="scene-fallback" src="./assets/clown-scene-clean.png" alt="" aria-hidden="true" />
      <div class="atmosphere" aria-hidden="true"></div>
      <canvas class="pixel-blast" id="pixel-blast" aria-hidden="true"></canvas>
      <canvas class="dither-veil" id="dither-veil" aria-label="Clown Boy figure rendered entirely as a monochrome dither pattern"></canvas>
      <div class="grain" aria-hidden="true"></div>
      <header class="topbar"><div class="mark"><span class="mark-dot"></span><span>NOCTURNE / 06</span></div><div class="edition">Halloween edition · 2026</div></header>
      <section class="copy" aria-labelledby="title">
        <p class="eyebrow">Silence looks scarier</p>
        <h1 id="title" class="spotlight-title" aria-label="Clown Boy"><span class="spotlight-line spotlight-text">Clown</span><span class="spotlight-line spotlight-text title-outline">Boy</span></h1>
        <p class="tagline spotlight-text">A small smile. A long night. Move through the darkness to reveal what is waiting underneath.</p>
        <div class="cta-row"><a class="cta" href="#details"><span>Enter the dark</span><span class="cta-arrow">↗</span></a><span class="edition-no">N° 01 / 26</span></div>
      </section>
      <aside class="hint"><span class="hint-ring"></span><span>Hover subject · Click to reveal all</span></aside>
      <div class="meta" id="details">
        <div class="meta-item"><span class="meta-label">Material</span><span class="meta-value">Vinyl</span></div>
        <div class="meta-item"><span class="meta-label">Scale</span><span class="meta-value">1 / 6</span></div>
        <div class="meta-item"><span class="meta-label">Status</span><span class="meta-value">Limited</span></div>
      </div>
      <div class="cursor" id="cursor" aria-hidden="true"></div>
    </main>
    <script type="text/plain" id="legacy-dither">
      (() => {
        const hero = document.getElementById('hero');
        const canvas = document.getElementById('dither-veil');
        const cursor = document.getElementById('cursor');
        const ctx = canvas.getContext('2d');
        const source = document.createElement('canvas');
        const sourceCtx = source.getContext('2d');
        const small = document.createElement('canvas');
        const smallCtx = small.getContext('2d', { willReadFrequently: true });
        const dots = document.createElement('canvas');
        const dotsCtx = dots.getContext('2d');
        const denseDots = document.createElement('canvas');
        const denseCtx = denseDots.getContext('2d');
        const mask = document.createElement('canvas');
        const maskCtx = mask.getContext('2d');
        const glow = document.createElement('canvas');
        const glowCtx = glow.getContext('2d');
        const image = new Image();
        const bayer = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
        const pointer = { x: 0, y: 0, px: 0, py: 0, inside: false, fresh: true };
        const bursts = [];
        let width = 0, height = 0, dpr = 1, last = performance.now(), crop = null;

        const measureCrop = () => {
          const probe = document.createElement('canvas');
          const probeCtx = probe.getContext('2d', { willReadFrequently: true });
          probe.width = image.naturalWidth;
          probe.height = image.naturalHeight;
          probeCtx.drawImage(image,0,0);
          const data = probeCtx.getImageData(0,0,probe.width,probe.height).data;
          let minX=probe.width, minY=probe.height, maxX=0, maxY=0;
          for (let y=0;y<probe.height;y+=2) for (let x=0;x<probe.width;x+=2) {
            if (data[(y*probe.width+x)*4+3]<12) continue;
            minX=Math.min(minX,x); minY=Math.min(minY,y); maxX=Math.max(maxX,x); maxY=Math.max(maxY,y);
          }
          const pad=8;
          return { x:Math.max(0,minX-pad), y:Math.max(0,minY-pad), w:Math.min(probe.width,maxX+pad)-Math.max(0,minX-pad), h:Math.min(probe.height,maxY+pad)-Math.max(0,minY-pad) };
        };

        const buildDither = () => {
          const cell = Math.max(4,Math.round(5*dpr));
          const cols = Math.ceil(width/cell), rows = Math.ceil(height/cell);
          small.width = dots.width = denseDots.width = cols;
          small.height = dots.height = denseDots.height = rows;
          smallCtx.clearRect(0,0,cols,rows);
          smallCtx.drawImage(source,0,0,cols,rows);
          const data = smallCtx.getImageData(0,0,cols,rows).data;
          const base = dotsCtx.createImageData(cols,rows);
          const dense = denseCtx.createImageData(cols,rows);

          for (let y=0;y<rows;y++) for (let x=0;x<cols;x++) {
            const i=(y*cols+x)*4;
            const alpha=data[i+3]/255;
            if (alpha<.04) continue;
            const lum=(data[i]*.2126+data[i+1]*.7152+data[i+2]*.0722)/255;
            const threshold=(bayer[(y&3)*4+(x&3)]+.5)/16;
            const baseDensity=Math.min(1,.07+Math.pow(lum,.82)*.9);
            const denseDensity=Math.min(1,.25+Math.pow(lum,.72)*.92);
            if (baseDensity>threshold) {
              base.data[i]=244; base.data[i+1]=232; base.data[i+2]=225; base.data[i+3]=Math.round(alpha*245);
            }
            if (denseDensity>threshold) {
              dense.data[i]=255; dense.data[i+1]=246; dense.data[i+2]=238; dense.data[i+3]=Math.round(alpha*255);
            }
          }
          dotsCtx.putImageData(base,0,0);
          denseCtx.putImageData(dense,0,0);
        };

        const layout = () => {
          dpr=Math.min(window.devicePixelRatio||1,1.5);
          width=Math.max(1,Math.round(innerWidth*dpr));
          height=Math.max(1,Math.round(innerHeight*dpr));
          [canvas,source,mask,glow].forEach(c=>{c.width=width;c.height=height;});
          canvas.style.width=`${innerWidth}px`;
          canvas.style.height=`${innerHeight}px`;
          if (!image.naturalWidth) return;
          sourceCtx.clearRect(0,0,width,height);
          const narrow=innerWidth<=820;
          const maxW=width*(narrow ? .96 : .64);
          const maxH=height*.95;
          const scale=Math.min(maxW/crop.w,maxH/crop.h);
          const drawW=crop.w*scale, drawH=crop.h*scale;
          const centerX=width*(narrow ? .5 : .61);
          const drawX=centerX-drawW/2;
          const drawY=height-drawH;
          sourceCtx.drawImage(image,crop.x,crop.y,crop.w,crop.h,drawX,drawY,drawW,drawH);
          buildDither();
        };

        const brush = (x,y,radius,strength=1) => {
          const g=maskCtx.createRadialGradient(x,y,radius*.2,x,y,radius);
          g.addColorStop(0,`rgba(255,255,255,${strength})`);
          g.addColorStop(.62,`rgba(255,255,255,${strength*.88})`);
          g.addColorStop(1,'rgba(255,255,255,0)');
          maskCtx.fillStyle=g;
          maskCtx.beginPath();
          maskCtx.arc(x,y,radius,0,Math.PI*2);
          maskCtx.fill();
        };

        const render = now => {
          const dt=Math.min(.05,(now-last)/1000); last=now;
          maskCtx.save();
          maskCtx.globalCompositeOperation='destination-out';
          maskCtx.fillStyle=`rgba(0,0,0,${Math.min(.14,dt/.85)})`;
          maskCtx.fillRect(0,0,width,height);
          maskCtx.restore();

          if (pointer.inside) {
            const follow=1-Math.exp(-dt/.045);
            pointer.px+=(pointer.x-pointer.px)*follow;
            pointer.py+=(pointer.y-pointer.py)*follow;
            brush(pointer.px*dpr,pointer.py*dpr,155*dpr);
          }

          for (let i=bursts.length-1;i>=0;i--) {
            const b=bursts[i], age=(now-b.start)/900;
            if (age>=1) { bursts.splice(i,1); continue; }
            const radius=(28+age*Math.hypot(innerWidth,innerHeight)*.34)*dpr;
            brush(b.x*dpr,b.y*dpr,radius,.68*(1-age));
          }

          ctx.clearRect(0,0,width,height);
          ctx.imageSmoothingEnabled=false;
          ctx.drawImage(dots,0,0,width,height);
          glowCtx.clearRect(0,0,width,height);
          glowCtx.globalCompositeOperation='source-over';
          glowCtx.imageSmoothingEnabled=false;
          glowCtx.drawImage(denseDots,0,0,width,height);
          glowCtx.globalCompositeOperation='destination-in';
          glowCtx.drawImage(mask,0,0);
          glowCtx.globalCompositeOperation='source-over';
          ctx.drawImage(glow,0,0);
          requestAnimationFrame(render);
        };

        const placePointer = e => {
          pointer.x=e.clientX; pointer.y=e.clientY;
          if (pointer.fresh) { pointer.px=pointer.x; pointer.py=pointer.y; pointer.fresh=false; }
          cursor.style.left=`${e.clientX}px`; cursor.style.top=`${e.clientY}px`;
        };
        hero.addEventListener('pointerenter',e=>{pointer.inside=true;pointer.fresh=true;hero.classList.add('has-pointer');placePointer(e);});
        hero.addEventListener('pointermove',e=>{pointer.inside=true;hero.classList.add('has-pointer');placePointer(e);},{passive:true});
        hero.addEventListener('pointerleave',()=>{pointer.inside=false;pointer.fresh=true;hero.classList.remove('has-pointer','is-pressing');});
        hero.addEventListener('pointerdown',e=>{placePointer(e);bursts.push({x:e.clientX,y:e.clientY,start:performance.now()});hero.classList.add('is-pressing');});
        hero.addEventListener('pointerup',()=>hero.classList.remove('is-pressing'));
        window.addEventListener('resize',layout,{passive:true});
        image.onload=()=>{crop=measureCrop();layout();requestAnimationFrame(render);};
        image.src='./assets/clown-cutout.png';
      })();
    </script>
    <script src="./pixel-blast.js?v=pixel-1"></script>
    <script src="./spotlight-text.js?v=spotlight-1"></script>
    <script src="./dither.js?v=ripple-05"></script>
  </body>
</html>
